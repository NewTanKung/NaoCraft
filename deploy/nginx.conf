# =========================================================
# NaoCraft — Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/naocraft
# Enable with: sudo ln -s /etc/nginx/sites-available/naocraft /etc/nginx/sites-enabled/
# =========================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name your-domain.com; # หรือใส่ IP เช่น 123.45.67.89

    client_max_body_size 500M; # รองรับการอัปโหลดไฟล์ JAR / World / ZIP ขนาดใหญ่

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── 1. Backend API & WebSocket Route ──────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket support (สำหรับหน้า Console Terminal แบบเรียลไทม์)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── 2. Frontend (Nuxt 3) Route ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
